kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agents-playground

# A single-node cluster. There is nothing to schedule across nodes: the app is
# pinned to one replica because it holds sessions and fixture state in process
# memory (see k8s/deployment.yaml), so extra nodes would only slow startup.
nodes:
  - role: control-plane
    # ingress-nginx's kind manifest only schedules its controller onto a node
    # carrying this label. Without it the controller pod stays Pending forever
    # with no obvious reason.
    labels:
      ingress-ready: "true"
    # 4273, deliberately NOT 4173.
    #
    # 4173 belongs to the rest of this repo: playwright.config.ts boots its
    # webServer there, npm run dev serves there, and the pre-push gate tests
    # against it. A kind cluster holds its host port for the cluster's whole
    # life, and Playwright's reuse check is a bare TCP connect that never asks
    # what is actually answering. Publishing the cluster on 4173 would make
    # every ordinary test run silently target the frozen container image
    # instead of the working tree - and report green. A separate port removes
    # the interference entirely rather than relying on anyone remembering to
    # run k8s:down first.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 4273
        # Matches the canary's loopback-only exposure. Without this kind binds
        # 0.0.0.0 and the app under test is reachable from the local network.
        listenAddress: "127.0.0.1"
        protocol: TCP

      # The front door. ingress-nginx listens on the node's port 80, and this
      # publishes it on the host as 4280 - not 80, which is privileged on some
      # systems and likely taken on a developer machine. 4273 above stays the
      # direct NodePort route to the app, so both ways in work.
      - containerPort: 80
        hostPort: 4280
        listenAddress: "127.0.0.1"
        protocol: TCP
