"""
A whole number of cents. Used for money so a balance can pass 32-bit limits.
"""
scalar Cents

"""
A price, as a whole number of micro-dollars: 1000000 is $1.00. Prices get six
decimals because cents are too coarse for a market -- a penny on a $0.39 coin
is a 2.5% jump -- and, like Cents, it is an integer so nothing rounds badly.
"""
scalar Micros

"""How far back a coin's chart reaches."""
enum ChartRange {
  H1
  H24
  D7
  D30
}

type Query {
  """The signed-in user, or an error if nobody is signed in."""
  me: User!

  """Every money account you own."""
  accounts: [MoneyAccount!]!

  """One of your accounts by id; someone else's answers as not found."""
  account(id: ID!): MoneyAccount!

  """Your saved payees for bill pay."""
  payees: [Payee!]!

  """Your recent bill payments."""
  billPayments: [BillPayment!]!

  """Your loans, newest first."""
  loans: [Loan!]!

  """One loan by id (yours, or any for staff)."""
  loan(id: ID!): Loan!

  """A loan quote: monthly payment, interest and schedule, nothing saved."""
  loanQuote(amountCents: Cents!, termMonths: Int!): LoanQuote!

  """Money requests, incoming (asked of you) and outgoing (you asked)."""
  requests: RequestsResult!

  """Your latest notifications and the unread count."""
  notifications: NotificationsResult!

  """Your support tickets, or every ticket for staff."""
  tickets: [SupportTicket!]!

  """One ticket with its messages (yours, or any for staff)."""
  ticket(id: ID!): TicketThread!

  """Your own market: every coin, your price for it, and a day of history."""
  market: [MarketCoin!]!

  """One coin on your own price line, with a chart for the chosen range."""
  coin(symbol: String!, range: ChartRange = H24): CoinDetail!

  """What you hold, what it is worth now, and your profit or loss."""
  portfolio: Portfolio!

  """Your filled trades, newest first."""
  trades: [Trade!]!

  """Your address for every coin, plus what you have sent and swapped."""
  wallet: WalletResult!

  """Your cards, one per account."""
  cards: [Card!]!

  """One of your cards by id; someone else's answers as not found."""
  card(id: ID!): Card!

  """
  Your limit orders, newest first, a page at a time. Pass the last page's
  endCursor as after to get the next one.
  """
  orders(symbol: String, first: Int = 20, after: String): OrderConnection!

  """Your price alerts, armed ones first."""
  priceAlerts(symbol: String): [PriceAlert!]!

  """
  Your API keys. Only with a signed-in session: a key can never list, make or
  revoke keys, so a leaked key cannot mint more of itself.
  """
  apiKeys: ApiKeysResult!

  """Every product in the gear shop, with its stock as it is now."""
  shopProducts: [ShopProduct!]!

  """One product, with what you would pay for one at your loyalty tier."""
  shopProduct(id: ID!): ShopProductDetail!

  """Your cart, priced at your loyalty tier."""
  cart: Cart!

  """Your shop orders, newest first."""
  shopOrders: [ShopOrder!]!

  """One of your shop orders; someone else's answers as not found."""
  shopOrder(id: ID!): ShopOrder!

  """
  Staff: every customer's shop orders, newest first, optionally one status.
  """
  staffShopOrders(status: ShopOrderStatus): [ShopOrder!]!

  """
  Admin: the audit log, newest first, a page at a time. Every staff action
  and every money action, through either door.
  """
  auditLog(action: String, door: AuditDoor, actorEmail: String, first: Int = 50, after: String): AuditEntryConnection!

  """Admin: every account's balance against the sum of its history rows."""
  books: BooksReport!
}

type Mutation {
  """Price a buy or a sell. The price holds for a few seconds."""
  quoteTrade(
    symbol: String!
    side: TradeSide!

    """On a buy: how much money to spend."""
    spendCents: Cents

    """On a sell: how much coin to sell."""
    quantityAtoms: Atoms
  ): TradeQuote!

  """
  Act on a quote: money and coin both move. The same idempotencyKey twice
  trades once.
  """
  trade(quoteId: ID!, accountId: ID!, idempotencyKey: String): TradeResult!

  """
  Send coin to another customer's address. The amount is a decimal string,
  because that is what a person types; it is read digit by digit, never
  through a float.
  """
  sendCoin(
    symbol: String!
    toAddress: String!
    quantity: String!
    memo: String

    """Optional: the same key twice sends once."""
    idempotencyKey: String
  ): WalletSend!

  """Swap one coin straight into another at your own two prices."""
  swapCoin(
    fromSymbol: String!
    toSymbol: String!
    quantity: String!

    """Optional: the same key twice swaps once."""
    idempotencyKey: String
  ): WalletSwap!

  """Add practice money to one of your accounts."""
  addFunds(
    accountId: ID!
    amountCents: Cents!

    """Optional: the same key twice adds the money once."""
    idempotencyKey: String
  ): MoneyAccount!

  """Send money to another account by its number."""
  transfer(
    fromAccountId: ID!
    toAccountNumber: String!
    amountCents: Cents!
    memo: String

    """
    Optional: the same key twice sends once; the same key with a different
    transfer is refused.
    """
    idempotencyKey: String
  ): TransferResult!

  """Pay a saved payee from one of your accounts."""
  payBill(
    fromAccountId: ID!
    payeeId: ID!
    amountCents: Cents!
    memo: String

    """Optional: the same key twice pays once."""
    idempotencyKey: String
  ): BillPaymentResult!

  """Ask for a loan; an Admin approves or rejects it later."""
  requestLoan(
    accountId: ID!
    amountCents: Cents!
    termMonths: Int!
    purpose: String

    """Optional: the same key twice asks once."""
    idempotencyKey: String
  ): Loan!

  """Ask another customer for money by their account number."""
  askForMoney(toAccountId: ID!, fromAccountNumber: String!, amountCents: Cents!, memo: String): MoneyRequest!

  """
  Pay a request that was asked of you. The same idempotencyKey twice pays once.
  """
  payRequest(id: ID!, fromAccountId: ID!, idempotencyKey: String): RequestPaidResult!

  """Decline a request that was asked of you."""
  declineRequest(id: ID!): MoneyRequest!

  """Cancel a request you asked for."""
  cancelRequest(id: ID!): MoneyRequest!

  """Mark one of your notifications read."""
  markNotificationRead(id: ID!): BankNotification!

  """Mark all your notifications read; returns how many changed."""
  markAllNotificationsRead: Int!

  """Open a support ticket, optionally about one of your transactions."""
  openTicket(subject: String!, body: String!, transactionId: ID): TicketThread!

  """Reply to a ticket you can see."""
  replyToTicket(id: ID!, body: String!): TicketThread!

  """Get a virtual debit card for one of your accounts."""
  getCard(accountId: ID!): Card!

  """Freeze or unfreeze your card, or change its daily limit."""
  updateCard(id: ID!, status: CardStatus, limitCents: Cents): Card!

  """
  Pay a merchant with your card. A frozen card, a limit reached for the day or
  an empty account declines it, and the answer says why.
  """
  chargeCard(
    id: ID!
    merchant: String!
    amountCents: Cents!

    """Optional: the same key twice charges once."""
    idempotencyKey: String
  ): CardChargeResult!

  """
  Buy at or below a price, or sell at or above one. It fills when your own
  price gets there, through the same quote and fee as a trade by hand.
  """
  placeOrder(
    symbol: String!
    side: TradeSide!
    accountId: ID!

    """On a buy: how much money to spend."""
    spendCents: Cents

    """On a sell: how much coin to sell."""
    quantityAtoms: Atoms
    limitMicros: Micros!
  ): Order!

  """Cancel one of your open orders."""
  cancelOrder(id: ID!): Order!

  """Be told once when a coin goes above or below a price."""
  createPriceAlert(symbol: String!, direction: AlertDirection!, limitMicros: Micros!): PriceAlert!

  """Cancel one of your armed alerts."""
  cancelPriceAlert(id: ID!): PriceAlert!

  """Make an API key. The token is in this answer and nowhere else, ever."""
  createApiKey(name: String!, scope: KeyScope = READ): NewApiKey!

  """Revoke one of your keys; the next request made with it is refused."""
  revokeApiKey(id: ID!): ApiKey!

  """Put a product in your cart, on top of any already there."""
  addToCart(productId: ID!, quantity: Int = 1): Cart!

  """Set how many of a product are in your cart; 0 takes it out."""
  setCartQuantity(productId: ID!, quantity: Int!): Cart!

  """
  Pay for your cart from one of your accounts. expectedTotalCents is the total
  you were shown: if the real total is different, nothing is charged and the
  error says the new one.
  """
  checkout(
    accountId: ID!
    expectedTotalCents: Cents!

    """Optional: the same key twice pays once."""
    idempotencyKey: String
  ): CheckoutResult!

  """Admin: move a shop order to its next step, never your own order."""
  advanceShopOrder(id: ID!, status: ShopOrderStatus!): ShopOrder!

  """
  Admin: refund a shop order before it is delivered, never your own order.
  """
  refundShopOrder(id: ID!, idempotencyKey: String): ShopOrder!

  """Admin: set how many of a product are in stock."""
  restockProduct(id: ID!, stock: Int!): ShopProduct!
}

"""
A shop order's step. It moves forward one step at a time, or ends refunded.
"""
enum ShopOrderStatus {
  PLACED
  PACKED
  SHIPPED
  DELIVERED
  REFUNDED
}

"""Which door an action came through."""
enum AuditDoor {
  REST
  GRAPHQL
}

"""A product in the gear shop."""
type ShopProduct {
  id: ID!
  name: String!
  category: String!
  listPriceCents: Cents!
  stock: Int!

  """Available or Backordered."""
  status: String!
  updatedAt: String!
}

"""
The share off for what you have spent in the shop, and the next tier up.
"""
type Loyalty {
  spentCents: Cents!

  """The share off, in hundredths of a percent: 200 is 2%."""
  basisPoints: Int!

  """What you need to have spent for the next tier; null at the top."""
  nextAtCents: Cents
  nextBasisPoints: Int
}

"""
A product with what the signed-in customer would pay. Null fields when signed out.
"""
type ShopProductDetail {
  product: ShopProduct!
  loyalty: Loyalty
  yourPriceCents: Cents
  inCart: Int
}

"""One product in the cart."""
type CartLine {
  productId: ID!
  name: String!
  category: String!
  quantity: Int!
  unitPriceCents: Cents!
  lineTotalCents: Cents!
  stock: Int!
  status: String!

  """Whether it can be bought as it is: available and enough in stock."""
  buyable: Boolean!
}

"""The cart, priced at the customer's loyalty tier."""
type Cart {
  lines: [CartLine!]!
  itemCount: Int!
  subtotalCents: Cents!
  discountBasisPoints: Int!
  discountCents: Cents!
  totalCents: Cents!
  loyalty: Loyalty!
}

"""One product in an order, at the price it was bought for."""
type ShopOrderLine {
  productId: ID!
  name: String!
  quantity: Int!
  unitPriceCents: Cents!
