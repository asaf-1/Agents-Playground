}

type SupportTicket {
  id: ID!
  subject: String!
  status: String!
  transactionId: ID
  transactionDescription: String
  customer: Customer!
  createdAt: String!
  updatedAt: String!
}

type TicketMessage {
  id: ID!
  body: String!
  authorName: String!
  fromStaff: Boolean!
  createdAt: String!
}

type TicketThread {
  ticket: SupportTicket!
