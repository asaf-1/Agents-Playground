  """open, filled, cancelled or failed."""
  status: String!
  fillPriceMicros: Micros
  tradeId: ID
  failReason: String
  failReasonText: String
  createdAt: String!
  filledAt: String
}

type OrderConnection {
  nodes: [Order!]!
  pageInfo: PageInfo!
  total: Int!
}

enum AlertDirection {
  ABOVE
  BELOW
}

type PriceAlert {
  id: ID!
  symbol: String!
  coinName: String!
  direction: AlertDirection!
  limitMicros: Micros!

  """armed, fired or cancelled."""
  status: String!
  firedMicros: Micros
  firedAt: String
  createdAt: String!
}

enum KeyScope {
  READ
  WRITE
}

type ApiKey {
  id: ID!
  name: String!
  scope: KeyScope!

  """The first characters of the token, kept to tell keys apart."""
  prefix: String!
  createdAt: String!
  lastUsedAt: String
  revokedAt: String
}

type ApiKeysResult {
  keys: [ApiKey!]!
  rateLimitPerMinute: Int!
  maxActiveKeys: Int!
}

type NewApiKey {
  key: ApiKey!

  """The token itself. Shown here once; the bank keeps only a hash."""
  token: String!
}
