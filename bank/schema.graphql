"""One coin turned straight into another."""
type WalletSwap {
  id: ID!
  fromSymbol: String!
  toSymbol: String!
  fromAtoms: Atoms!
  fromQuantity: String!
  toAtoms: Atoms!
  toQuantity: String!
  valueCents: Cents!
  feeCents: Cents!
