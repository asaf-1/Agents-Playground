  accountNumber: String!
  ownerEmail: String!
  balanceCents: Cents!
  linesCents: Cents!
  differenceCents: Cents!
}

"""
The books check: every account's balance against the sum of its history.
Demo accounts carry a sample history and are counted, not checked.
"""
type BooksReport {
  balanced: Boolean!
  checkedAccounts: Int!
  sampleAccounts: Int!
  totalBalanceCents: Cents!
  totalLinesCents: Cents!
  differenceCents: Cents!
  outOfBalance: [BooksAccount!]!
  checkedAt: String!
}

type User {
  id: ID!
  email: String!
  fullName: String!
  role: String!
  status: String!
  isDemo: Boolean!
  createdAt: String!
}

"""Another account's owner. Only the number is yours to see."""
type Counterparty {
  accountNumber: String!
  fullName: String
  email: String
}

type MoneyAccount {
  id: ID!
  number: String!
  kind: String!
  name: String!
  balanceCents: Cents!
  createdAt: String!

  """This account's history, with the same filters and pages as REST."""
  transactions(from: String, to: String, type: String, minCents: Cents, maxCents: Cents, page: Int, pageSize: Int): TransactionsPage!

  """
  The same history newest first, a page after a cursor: pass the last
  page's endCursor as after. Unlike page numbers, a payment that lands while
  you page does not shift the pages you have not read yet.
  """
  history(first: Int = 20, after: String, from: String, to: String, type: String, minCents: Cents, maxCents: Cents): TransactionConnection!
}

type MoneyTransaction {
  id: ID!
  accountId: ID!
  kind: String!
  amountCents: Cents!
  balanceAfterCents: Cents!
  description: String!
  memo: String!

  """The other side as plain text (an account number or payee reference)."""
  counterparty: String!
  transferId: ID
  createdAt: String!

  """The other side as an object. Only the number is yours to see."""
  counterpartyDetails: Counterparty

  """The transfer behind this row, if it was a transfer."""
  transfer: Transfer
}

type TransactionsPage {
  transactions: [MoneyTransaction!]!
  page: Int!
  pageSize: Int!
  total: Int!
  totalPages: Int!
}

type Transfer {
  id: ID!
  fromAccountId: ID!
  toAccountNumber: String!
  amountCents: Cents!
  memo: String!
  createdAt: String!

  """The sending account, if you own it."""
  fromAccount: MoneyAccount

  """The receiving account, if you own it."""
  toAccount: MoneyAccount
}

type TransferResult {
  transfer: Transfer!
  fromAccount: MoneyAccount!
  replayed: Boolean!
}

type Payee {
  id: ID!
  name: String!
  reference: String!
  createdAt: String!
}

type BillPayment {
  id: ID!
  accountId: ID!
  payeeId: ID!
  payeeName: String!
  payeeReference: String!
  amountCents: Cents!
  memo: String!
  createdAt: String!
}

type BillPaymentResult {
  payment: BillPayment!
  fromAccount: MoneyAccount!
  replayed: Boolean!
}

type ScheduleRow {
  month: Int!
  paymentCents: Cents!
  principalCents: Cents!
  interestCents: Cents!
  balanceCents: Cents!
}

"""
Why this customer was offered this rate. There is no published rate card:
the offer is worked out from what the bank can see of them, so the same ask
on the same day costs two customers different amounts.
"""
type RateReasons {
  """Where the curve starts for this term. Longer money costs more."""
  termBp: Int!

  """Taken off for standing: balances, time here, earlier loans, activity."""
  discountBp: Int!

  """Added because of how big this ask is next to what they already hold."""
  exposureBp: Int!

  """Their standing, 0 to 1."""
  score: Float!

  """This ask against their own money, 0 to 1."""
  exposure: Float!
  balanceCents: Cents!
  tenureDays: Int!
  loansApproved: Int!
  loansRejected: Int!
  transactions: Int!
}

type LoanQuote {
  amountCents: Cents!
  termMonths: Int!
  aprBasisPoints: Int!
  monthlyPaymentCents: Cents!
  totalInterestCents: Cents!
  totalRepaidCents: Cents!
  schedule: [ScheduleRow!]!

  """Why this rate, for this customer."""
  rate: RateReasons!
}

type Loan {
  id: ID!
  accountId: ID!
  accountNumber: String!
  amountCents: Cents!
  termMonths: Int!
  aprBasisPoints: Int!
  monthlyPaymentCents: Cents!
  totalInterestCents: Cents!
  purpose: String!
  status: String!
  decisionNote: String
  decidedAt: String
  createdAt: String!

  """The borrower; only staff see this."""
  customer: Customer

  """The repayment schedule."""
  schedule: [ScheduleRow!]!
}

type Customer {
  id: ID!
  fullName: String!
  email: String!
  isDemo: Boolean!
}

type MoneyRequest {
  id: ID!
  amountCents: Cents!
  memo: String!
  status: String!
  requesterName: String!
  toAccountNumber: String!
  payerAccountNumber: String!
  transferId: ID
  answeredAt: String
  createdAt: String!
}

type RequestsResult {
  incoming: [MoneyRequest!]!
  outgoing: [MoneyRequest!]!
}

type RequestPaidResult {
  request: MoneyRequest!
  transfer: Transfer!
  fromAccount: MoneyAccount!
}

type BankNotification {
  id: ID!
  kind: String!
  title: String!
  body: String!
  link: String!
  amountCents: Cents
  read: Boolean!
  createdAt: String!
}

type NotificationsResult {
  notifications: [BankNotification!]!
