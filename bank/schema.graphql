  customerName: String!
  customerEmail: String!
  accountId: ID!
  accountNumber: String!
  itemCount: Int!
  subtotalCents: Cents!
  discountBasisPoints: Int!
  discountCents: Cents!

  """What was taken from the account."""
  totalCents: Cents!

  """What has gone back."""
  refundedCents: Cents!
  createdAt: String!
  updatedAt: String!
  lines: [ShopOrderLine!]!
  events: [ShopOrderEvent!]!
}

"""A paid order and the account it was paid from, as it is now."""
type CheckoutResult {
  order: ShopOrder!
  account: MoneyAccount!
}

"""One line of the audit log."""
type AuditEntry {
  id: ID!
  actorEmail: String!
  actorRole: String!
  action: String!
  targetType: String!
  targetId: String!
  door: AuditDoor!

  """session or api_key."""
