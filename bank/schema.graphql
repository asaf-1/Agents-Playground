}

"""One step an order took, who took it, and when."""
type ShopOrderEvent {
  status: ShopOrderStatus!
  note: String!
  actorName: String
  actorRole: String
  createdAt: String!
}

"""An order from the gear shop."""
type ShopOrder {
  id: ID!
