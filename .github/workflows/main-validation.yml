name: Main Branch Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  full-regression:
    name: Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_RUNNER_PRIMARY_IMAGE: ghcr.io/asaf-1/genai-agenticai-demo-playwright:main
      PLAYWRIGHT_NODE_MODULES_VOLUME: gha-main-pw-nm-${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Playwright runner image
        id: runner
        shell: bash
        run: |
          image=$(bash ./scripts/docker/resolve-playwright-runner.sh "$PLAYWRIGHT_RUNNER_PRIMARY_IMAGE" "" "agentic-ai-demo-playwright-main")
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Run shard ${{ matrix.shard }}/4 (4 workers, containerized)
        shell: bash
        run: |
          bash ./scripts/docker/run-containerized-playwright.sh "${{ steps.runner.outputs.image }}" 'npx playwright test --shard=${{ matrix.shard }}/4 --workers=4 --reporter=blob'

      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-blob-${{ matrix.shard }}
          path: blob-report/
          include-hidden-files: true
          retention-days: 14

  report:
    name: Full Regression Report
    needs: full-regression
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: main-blob-*
          merge-multiple: true

      - name: Merge shard reports into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blobs || true

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-merged-report-${{ github.sha }}
          path: playwright-report/
          include-hidden-files: true
          retention-days: 14

      - name: Enforce full regression result
        run: |
          echo "shards=${{ needs.full-regression.result }}"
          if [ "${{ needs.full-regression.result }}" != "success" ]; then
            echo "::error::Main full regression failed (shards=${{ needs.full-regression.result }})"
            exit 1
          fi
          echo "Main full regression passed: all 4 shards green."
