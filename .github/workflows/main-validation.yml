name: Main Branch Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_RUNNER_PRIMARY_IMAGE: ghcr.io/asaf-1/genai-agenticai-demo-playwright:${{ github.sha }}
      PLAYWRIGHT_NODE_MODULES_VOLUME: gha-main-playwright-node-modules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Playwright runner image
        id: runner
        shell: bash
        run: |
          image=$(bash ./scripts/docker/resolve-playwright-runner.sh "$PLAYWRIGHT_RUNNER_PRIMARY_IMAGE" "" "agentic-ai-demo-playwright-main")
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Run full regression
        shell: bash
        run: |
          bash ./scripts/docker/run-containerized-playwright.sh "${{ steps.runner.outputs.image }}" 'npx playwright test --reporter=list'

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-test-artifacts-${{ github.sha }}
          path: |
            .artifacts/
            test-results/
            docs/obsidian-vault/Reports/
          retention-days: 14
