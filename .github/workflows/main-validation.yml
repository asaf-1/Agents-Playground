name: Main Branch Validation

on:
  push:
    branches: [main]

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: node server.js &
        env:
          PORT: 4173

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:4173/api/health --timeout 15000

      - name: Run full regression
        run: npx playwright test --reporter=list

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-test-artifacts-${{ github.sha }}
          path: |
            .artifacts/
            test-results/
            docs/obsidian-vault/Reports/
          retention-days: 14
