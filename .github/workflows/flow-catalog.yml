name: Flow Catalog

# Keeps scripts/test-runner/flow-catalog.json in step with the specs in the
# repository, so a newly pushed spec becomes a runnable flow with nobody editing
# a list by hand.
#
# It commits ONLY that JSON file. An earlier version also regenerated a `flow`
# dropdown inside remote-test-runner.yml and failed on the push: GitHub refuses
# to let a GitHub App create or update a workflow file without `workflows`
# permission, and the default GITHUB_TOKEN cannot be granted it. Anything under
# .github/workflows/ therefore has to be edited by a human, not by CI.
#
# The commit is made with the default GITHUB_TOKEN. Pushes made with that token
# do not trigger workflows, so this job cannot retrigger itself: no loop, and no
# need for a [skip ci] convention.

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "web/src/**"
      - "playwright.config.ts"
      - "playwright.visual.config.ts"
      - "scripts/test-runner/**"
      - ".github/workflows/flow-catalog.yml"
  workflow_dispatch:

# contents: write is scoped to this single job and used only to commit the
# regenerated catalog file.
permissions:
  contents: write

concurrency:
  group: flow-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh flow catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Discovery asks Playwright for the resolved test tree. --list loads the
      # config and spec files but launches no browser, so no install is needed.
      - name: Discover flows
        run: node scripts/test-runner/discover-flows.js

      - name: Detect catalog change
        id: diff
        shell: bash
        env:
          GENERATED_FILES: scripts/test-runner/flow-catalog.json
        run: |
          if git diff --quiet -- $GENERATED_FILES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Flow catalog already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Flow catalog updated"
              echo ""
              echo '```diff'
              git diff --stat -- $GENERATED_FILES
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit refreshed catalog
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-runner/flow-catalog.json
          git commit -m "chore(test-runner): refresh flow catalog"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report totals
        shell: bash
        run: |
          node -e 'const c = require("./scripts/test-runner/flow-catalog.json"); console.log(`${c.totals.flows} flows, ${c.totals.specFiles} spec files, ${c.totals.e2eTests} E2E tests.`);' >> "$GITHUB_STEP_SUMMARY"
