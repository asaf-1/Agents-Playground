name: Remote Test Runner

# Every run is named after the flow and who asked for it. Without this, GitHub
# titles a run after the workflow (or, for push events, the commit message), so
# a list of runs reads like a list of commits and says nothing about which tests
# ran. The runner's history is about tests, so the title has to be about tests.
#
# The title is also the only caller-written string GitHub hands back with run
# metadata, so it is the one place attribution survives a reload or a different
# browser. That makes the text below a contract: parseTitleRequester() in
# test-runner/public/app.js reads the requester back out of it, so the marker
# has to stay byte-for-byte in step with that constant, separator included
# (U+00B7, not an ASCII dot). github.actor stays as the last fallback because
# for a run started from the Actions UI or the gh CLI the actor IS the
# requester; for a run started from the app it is only the shared token owner,
# which is why an explicit requested_by has to win.
run-name: >-
  ${{ inputs.flow_override || inputs.flow || github.event.client_payload.flow || 'group-sanity' }}
  · ${{ inputs.requested_by && format('requested by {0}', inputs.requested_by) || github.event.client_payload.requested_by && format('requested by {0}', github.event.client_payload.requested_by) || github.actor }}

# The outsourced test runner. Anything that can reach GitHub can start a run
# here, so nobody needs a local Node install, browsers, or the repository:
#
#   * the Test Runner page in the app (POST /api/test-runner/runs)
#   * the Actions UI (Run workflow)
#   * gh CLI / npm run test:remote
#   * repository_dispatch from any other system (curl, Slack bot, another repo)
#   * workflow_call from another workflow that wants this suite as a step
#
# Flow ids come from scripts/test-runner/flow-catalog.json, which CI keeps in
# sync with the specs on every push (see flow-catalog.yml). The `flow` input is
# free text: resolve-flow.js validates it against the committed catalog in the
# plan job and fails fast with the list of valid ids, before any shard spends
# time installing a browser.

on:
  workflow_dispatch:
    inputs:
      # Free text, deliberately not a generated `choice` dropdown. GitHub refuses
      # to let the default GITHUB_TOKEN push changes to a workflow file, so a
      # dropdown generated from the flow catalog could never be kept in step by CI
      # (it failed with: refusing to allow a GitHub App to create or update
      # workflow ... without `workflows` permission). The plan job validates the id
      # against the committed catalog and fails fast listing the valid ones, and the
      # Test Runner app is the real picker.
      flow:
        description: "Flow id (npm run flows:list, or the Test Runner app)"
        required: true
        default: group-sanity
        type: string
      flow_override:
        description: "Alias for flow; wins when both are set (kept for API callers)"
        required: false
        type: string
      target_url:
        description: "Run against an existing deployment (blank = build and serve the app here)"
        required: false
        type: string
      shards:
        description: "Parallel shards (blank = the flow's own maximum)"
        required: false
        type: choice
        default: ""
        options: ["", "1", "2", "4", "8"]
      browser:
        description: "Browser"
        required: false
        type: choice
        default: chromium
        options: [chromium, firefox, webkit]
      retries:
        description: "Retries per test"
        required: false
        type: choice
        default: "0"
        options: ["0", "1", "2", "3"]
      workers:
        description: "Workers per shard"
        required: false
        type: choice
        default: "2"
        options: ["1", "2", "4", "8"]
      reason:
        description: "Why this run was started (recorded in the job summary)"
        required: false
        type: string
      # Who asked, as opposed to which credential dispatched. Free text rather
      # than a choice for the same reason as `flow`: the accounts are not known
      # when this file is written. Optional because the Actions UI, the gh CLI
      # and repository_dispatch all omit it, and run-name falls back to
      # github.actor when they do.
      requested_by:
        description: "Account that asked for this run (the Test Runner app fills this in; leave blank here)"
        required: false
        default: ""
        type: string

  # Lets any external caller with repo write access start a run over HTTPS.
  repository_dispatch:
    types: [remote-test-run]

  # Lets another workflow consume this runner as a reusable step.
  workflow_call:
    inputs:
      flow:
        required: true
        type: string
      flow_override:
        required: false
        type: string
      target_url:
        required: false
        type: string
      shards:
        required: false
        type: string
      browser:
        required: false
        type: string
      retries:
        required: false
        type: string
      workers:
        required: false
        type: string
      reason:
        required: false
        type: string
      # Declared here too, or inputs.requested_by reads empty under
      # workflow_call and a calling workflow could never pass it on.
      requested_by:
        required: false
        type: string
    outputs:
      result:
        description: "success or failure of the test shards"
        value: ${{ jobs.report.outputs.result }}
      flow_name:
        description: "Human-readable name of the flow that ran"
        value: ${{ jobs.plan.outputs.flow_name }}

permissions:
  contents: read

# Runs are independent on purpose: one person starting a run must never cancel
# a colleague's run of the same flow.
concurrency:
  group: remote-test-runner-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Caller values reach Node as environment variables, never as shell text.
    env:
      TR_FLOW: ${{ inputs.flow_override || inputs.flow || github.event.client_payload.flow || 'group-sanity' }}
      TR_TARGET_URL: ${{ inputs.target_url || github.event.client_payload.target_url || '' }}
      TR_SHARDS: ${{ inputs.shards || github.event.client_payload.shards || '' }}
      TR_BROWSER: ${{ inputs.browser || github.event.client_payload.browser || 'chromium' }}
      TR_RETRIES: ${{ inputs.retries || github.event.client_payload.retries || '0' }}
      TR_WORKERS: ${{ inputs.workers || github.event.client_payload.workers || '2' }}
      TR_REASON: ${{ inputs.reason || github.event.client_payload.reason || '' }}
    outputs:
      flow_id: ${{ steps.resolve.outputs.flow_id }}
      flow_name: ${{ steps.resolve.outputs.flow_name }}
      flow_kind: ${{ steps.resolve.outputs.flow_kind }}
      runner: ${{ steps.resolve.outputs.runner }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      shard_count: ${{ steps.resolve.outputs.shard_count }}
      needs_app: ${{ steps.resolve.outputs.needs_app }}
      needs_browser_install: ${{ steps.resolve.outputs.needs_browser_install }}
      browser: ${{ steps.resolve.outputs.browser }}
      target_url: ${{ steps.resolve.outputs.target_url }}
      ref: ${{ steps.ref.outputs.ref }}

    steps:
      # repository_dispatch always runs on the default branch, so an external
      # caller names the revision it wants in the payload.
      - name: Resolve revision
        id: ref
        shell: bash
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.ref || '' }}
        run: |
          if [ -n "$PAYLOAD_REF" ]; then
            echo "ref=$PAYLOAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validates the flow id and every option against the committed catalog.
      # An unknown flow or a bad option fails the run here, before any shard
      # spends time on npm ci and a browser download.
      - name: Resolve flow into an execution plan
        id: resolve
        run: node scripts/test-runner/resolve-flow.js

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: remote-test-plan-${{ github.run_number }}
          path: .artifacts/test-runner/plan.json
          include-hidden-files: true
          retention-days: 7

  test:
    name: ${{ needs.plan.outputs.flow_name }} (${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TR_FLOW: ${{ needs.plan.outputs.flow_id }}
      TR_TARGET_URL: ${{ needs.plan.outputs.target_url }}
      TR_SHARDS: ${{ needs.plan.outputs.shard_count }}
      TR_BROWSER: ${{ needs.plan.outputs.browser }}
      TR_RETRIES: ${{ inputs.retries || github.event.client_payload.retries || '0' }}
      TR_WORKERS: ${{ inputs.workers || github.event.client_payload.workers || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        if: needs.plan.outputs.needs_browser_install == 'true'
        env:
          RUNNER_BROWSER: ${{ needs.plan.outputs.browser }}
        run: npx playwright install --with-deps "$RUNNER_BROWSER"

      # Re-resolved rather than downloaded: same commit plus same inputs yields
      # the same plan, and every shard re-runs the same validation.
      - name: Resolve plan for this shard
        run: node scripts/test-runner/resolve-flow.js

      - name: Run flow
        run: node scripts/test-runner/exec-flow.js --shard ${{ matrix.shard }}

      - name: Upload blob report
        if: always() && needs.plan.outputs.runner != 'vitest'
        uses: actions/upload-artifact@v4
        with:
          name: remote-test-blob-${{ github.run_number }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-test-artifacts-${{ github.run_number }}-${{ matrix.shard }}
          path: |
            .artifacts/
            test-results/
          include-hidden-files: true
          retention-days: 7

  report:
    name: Report
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ needs.test.result }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        if: needs.plan.outputs.runner != 'vitest'
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: remote-test-blob-${{ github.run_number }}-*
          merge-multiple: true

      - name: Merge shard reports into one HTML report
        if: needs.plan.outputs.runner != 'vitest'
        run: npx playwright merge-reports --reporter=html ./all-blobs || true

      - name: Upload merged HTML report
        if: needs.plan.outputs.runner != 'vitest'
        uses: actions/upload-artifact@v4
        with:
          name: remote-test-report-${{ needs.plan.outputs.flow_id }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      # Machine-readable results, so the Test Runner app can show WHICH tests
      # failed instead of just a red run. The HTML report above is for humans
      # and cannot be parsed reliably; this one is the contract.
      # Stable artifact name (no run number): it is unique within a run, and the
      # app looks it up by name.
      - name: Produce machine-readable results
        if: needs.plan.outputs.runner != 'vitest'
        shell: bash
        run: |
          mkdir -p .artifacts/test-runner
          npx playwright merge-reports --reporter=json ./all-blobs \
            > .artifacts/test-runner/results.json 2> .artifacts/test-runner/results.err || true

          if [ ! -s .artifacts/test-runner/results.json ]; then
            echo "::warning::Could not produce results.json; the app will fall back to run status only."
            cat .artifacts/test-runner/results.err || true
          fi

      - name: Upload machine-readable results
        if: needs.plan.outputs.runner != 'vitest'
        uses: actions/upload-artifact@v4
        with:
          name: remote-test-results
          path: .artifacts/test-runner/results.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Write run summary
        shell: bash
        env:
          FLOW_NAME: ${{ needs.plan.outputs.flow_name }}
          FLOW_ID: ${{ needs.plan.outputs.flow_id }}
          SHARD_RESULT: ${{ needs.test.result }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
          TARGET_URL: ${{ needs.plan.outputs.target_url }}
          BROWSER: ${{ needs.plan.outputs.browser }}
        run: |
          {
            echo "## Result: $SHARD_RESULT"
            echo ""
            echo "- **Flow**: $FLOW_NAME (\`$FLOW_ID\`)"
            echo "- **Shards**: $SHARD_COUNT"
            echo "- **Browser**: $BROWSER"
            echo "- **Target**: ${TARGET_URL:-app built and served by this run}"
            echo "- **Report**: see the remote-test-report-* artifact on this run"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reflect the test result
        if: needs.test.result != 'success'
        run: |
          echo "::error::Remote test run failed (shards: ${{ needs.test.result }})"
          exit 1
