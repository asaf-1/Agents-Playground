name: AI Review Gate

on:
  pull_request:
    branches: [main]
    # No "opened"/"synchronize" gate run: an un-reviewed head never shows a red
    # "not reviewed yet" failure. The review check reports only once a review is
    # attested (the ai-reviewed label is added); a new commit clears the stale
    # attestation so the gate returns to neutral instead of failing.
    types: [labeled, unlabeled, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ai-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A new commit invalidates a prior review: drop the ai-reviewed label so the
  # gate goes back to "awaiting review" (neutral) rather than failing red.
  reset-on-new-commit:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Clear stale ai-reviewed label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: "ai-reviewed",
              });
            } catch (error) {
              // Label not present -> nothing to clear.
            }

  current-head-review:
    name: Current Head Review
    # Runs only once a review is attested (ai-reviewed label present) and the
    # head has not just changed. Result: green when reviewed, otherwise the
    # check is simply absent/skipped -- never a red failure for un-reviewed code.
    if: >-
      github.event.action != 'synchronize' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'ai-reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Codex or Claude review evidence for current head
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              },
            );

            const trustedAssociations = new Set([
              "OWNER",
              "MEMBER",
              "COLLABORATOR",
            ]);
            const shaMarker = "AI-REVIEWED-SHA: " + headSha;
            const reviewerPattern = /AI-REVIEWER:\s*(codex|claude)/i;
            const evidence = comments
              .slice()
              .reverse()
              .find(
                (comment) =>
                  trustedAssociations.has(comment.author_association) &&
                  comment.body.includes("<!-- ai-review-gate -->") &&
                  comment.body.includes(shaMarker) &&
                  reviewerPattern.test(comment.body),
              );

            if (!evidence) {
              core.setFailed(
                "The ai-reviewed label is present but no trusted attestation matches head " +
                  headSha +
                  ". Re-run review:ai:mark for the current head.",
              );
              return;
            }

            await core.summary
              .addHeading("AI review evidence")
              .addRaw("Current head: " + headSha + "\n")
              .addRaw("Evidence comment: " + evidence.html_url + "\n")
              .write();
