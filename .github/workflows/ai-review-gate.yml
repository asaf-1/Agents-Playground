name: AI Review Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ai-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-head-review:
    name: Current Head Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Codex or Claude review evidence for current head
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;
            const hasLabel = pr.labels.some((label) => label.name === "ai-reviewed");

            if (!hasLabel) {
              core.setFailed(
                "Missing ai-reviewed label. Run npm.cmd run review:ai:mark after reviewing the current PR head.",
              );
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              },
            );

            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const shaMarker = "AI-REVIEWED-SHA: " + headSha;
            const reviewerPattern = /AI-REVIEWER:\s*(codex|claude)/i;
            const evidence = comments
              .slice()
              .reverse()
              .find(
                (comment) =>
                  trustedAssociations.has(comment.author_association) &&
                  comment.body.includes("<!-- ai-review-gate -->") &&
                  comment.body.includes(shaMarker) &&
                  reviewerPattern.test(comment.body),
              );

            if (!evidence) {
              core.setFailed(
                "No trusted Codex/Claude review attestation matches current head " + headSha + ".",
              );
              return;
            }

            await core.summary
              .addHeading("AI review evidence")
              .addRaw("Current head: " + headSha + "\n")
              .addRaw("Evidence comment: " + evidence.html_url + "\n")
              .write();
