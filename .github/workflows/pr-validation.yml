name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  test:
    name: Shard ${{ matrix.shard }}/4
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run shard ${{ matrix.shard }}/4 (4 workers)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=4 --reporter=blob
      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  gate:
    name: Pre-Merge Gate
    needs: [format, test]
    if: ${{ always() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download shard blob reports
        if: needs.test.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: pr-blob-*
          merge-multiple: true
      - name: Merge shard reports into one HTML report
        if: needs.test.result != 'skipped'
        run: npx playwright merge-reports --reporter=html ./all-blobs || true
      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-merged-report-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
      - name: Enforce gate (format + all 4 shards must pass)
        run: |
          echo "format=${{ needs.format.result }} test=${{ needs.test.result }}"
          if [ "${{ needs.format.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Pre-Merge Gate failed (format=${{ needs.format.result }}, shards=${{ needs.test.result }})"
            exit 1
          fi
          echo "Pre-Merge Gate passed: formatting clean and all 4 shards green."
