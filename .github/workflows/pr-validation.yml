name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_RUNNER_PRIMARY_IMAGE: ghcr.io/asaf-1/genai-agenticai-demo-playwright:main
      PLAYWRIGHT_NODE_MODULES_VOLUME: gha-pr-playwright-node-modules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Playwright runner image
        id: runner
        shell: bash
        run: |
          image=$(bash ./scripts/docker/resolve-playwright-runner.sh "$PLAYWRIGHT_RUNNER_PRIMARY_IMAGE" "" "agentic-ai-demo-playwright-pr")
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Run sanity + contracts
        shell: bash
        run: |
          bash ./scripts/docker/run-containerized-playwright.sh "${{ steps.runner.outputs.image }}" 'npx playwright test tests/e2e/sanity tests/e2e/contracts --reporter=list'

      - name: Run functional tests
        shell: bash
        run: |
          bash ./scripts/docker/run-containerized-playwright.sh "${{ steps.runner.outputs.image }}" 'npx playwright test tests/e2e/functional --reporter=list'

      - name: Run scenario tests
        shell: bash
        run: |
          bash ./scripts/docker/run-containerized-playwright.sh "${{ steps.runner.outputs.image }}" 'npx playwright test tests/e2e/scenarios --reporter=list'

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-artifacts
          path: |
            .artifacts/
            test-results/
          retention-days: 7
