name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  test:
    name: Shard ${{ matrix.shard }}/4
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run shard ${{ matrix.shard }}/4 (4 workers)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=4 --reporter=blob
      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  gate:
    name: Pre-Merge Gate
    needs: [format, test]
    if: ${{ always() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # One step. No checkout, no node, no npm install, no artifacts, no network.
    #
    # This is a REQUIRED check - its result decides whether a PR can merge - so
    # the only thing that may fail it is its own verdict.
    #
    # It used to also download the four shard blob artifacts and merge them into
    # a single browsable HTML report. Useful, but a report generator, not a gate:
    # it plays no part in deciding whether the tests passed. On 2026-08-28 it went
    # red twice in a row on a PR whose formatting and all four shards were green:
    #
    #   Unable to download artifact(s): Artifact download failed after 5 retries
    #
    # GitHub's own artifact storage would not serve one blob out of four. In 20
    # runs of this workflow that was the only failure, so it is not a long-running
    # flake - but a required check that can go red because of someone else's
    # storage is not a gate, and a flaky gate is worse than none, because people
    # learn to re-run it instead of reading it.
    #
    # Removed rather than wrapped in continue-on-error. Six guarded network steps
    # in a required check is still six things that can go wrong.
    #
    # Nothing is lost but the pre-merged view: each shard still uploads its own
    # `pr-blob-*` artifact. To read a failure, download them and run
    #   npx playwright merge-reports --reporter=html <dir>
    #
    # Keep this job at one step. Anything added here can block a merge.
    steps:
      - name: Enforce gate (format + all 4 shards must pass)
        run: |
          echo "format=${{ needs.format.result }} test=${{ needs.test.result }}"
          if [ "${{ needs.format.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Pre-Merge Gate failed (format=${{ needs.format.result }}, shards=${{ needs.test.result }})"
            exit 1
          fi
          echo "Pre-Merge Gate passed: formatting clean and all 4 shards green."
