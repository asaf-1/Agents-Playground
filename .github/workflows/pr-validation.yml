name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run sanity + contracts
        run: npx playwright test tests/e2e/sanity tests/e2e/contracts --reporter=list

      - name: Run functional tests
        run: npx playwright test tests/e2e/functional --reporter=list

      - name: Run scenario tests
        run: npx playwright test tests/e2e/scenarios --reporter=list

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-artifacts
          path: |
            .artifacts/
            test-results/
          retention-days: 7
