name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pre-Merge Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_RUNNER_PRIMARY_IMAGE: ghcr.io/asaf-1/genai-agenticai-demo-playwright:main
      PLAYWRIGHT_NODE_MODULES_VOLUME: gha-pr-${{ github.event.pull_request.number }}-playwright-node-modules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Read pipeline policy
        id: policy
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const policy = JSON.parse(fs.readFileSync("pipeline.config.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "docker_enabled=" + (policy.preMerge?.dockerEnabled === true) + "\n");'

      - name: Build app Docker image
        if: steps.policy.outputs.docker_enabled == 'true'
        run: docker build -t "agents-playground-pr:${{ github.event.pull_request.head.sha }}" .

      - name: Log in to GHCR
        if: steps.policy.outputs.docker_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Playwright runner image
        id: runner
        if: steps.policy.outputs.docker_enabled == 'true'
        shell: bash
        run: |
          image=$(bash ./scripts/docker/resolve-playwright-runner.sh "$PLAYWRIGHT_RUNNER_PRIMARY_IMAGE" "" "agents-playground-playwright-pr")
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Run full Playwright regression in Docker
        if: steps.policy.outputs.docker_enabled == 'true'
        shell: bash
        run: |
          bash ./scripts/docker/run-containerized-playwright.sh "${{ steps.runner.outputs.image }}" 'npm ci && npm run test:e2e -- --reporter=list'

      - name: Record disabled pre-merge Docker gate
        if: steps.policy.outputs.docker_enabled != 'true'
        run: echo "Pre-merge Docker is disabled in pipeline.config.json; running host Playwright." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browser for host validation
        if: steps.policy.outputs.docker_enabled != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run full Playwright regression without Docker
        if: steps.policy.outputs.docker_enabled != 'true'
        run: npm run test:e2e -- --reporter=list

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-artifacts-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            .artifacts/
            test-results/
          include-hidden-files: true
          retention-days: 7
