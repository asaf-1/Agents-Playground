name: Terraform Validate

# Checks that terraform/ is formatted and valid, then lints it with TFLint,
# without building anything. TFLint's rules are in terraform/.tflint.hcl.
#
# Advisory: it is not a required check, so a failure warns on the PR but never
# blocks the merge. PR Validation / Pre-Merge Gate stays the only required
# check. Runs only when terraform/ or this file changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The same pinned version as k8s-canary.yml.
      TF_VERSION: 1.16.2
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"
      TFLINT_VERSION: v0.64.0
      # SHA256 of tflint_linux_amd64.zip. Written here, not downloaded, so a
      # swapped release file fails the install. It was taken from the release's
      # checksums.txt after cosign showed that file was signed by
      # terraform-linters/tflint's own release workflow.
      TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        shell: bash
        run: |
          # The same install as k8s-canary.yml: HashiCorp's release server,
          # checked against the published SHA256SUMS, unpacked in $RUNNER_TEMP.
          base="https://releases.hashicorp.com/terraform/${TF_VERSION}"
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "$base/$zip"
          curl -fsSLo "$RUNNER_TEMP/terraform_SHA256SUMS" "$base/terraform_${TF_VERSION}_SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $zip\$" terraform_SHA256SUMS | sha256sum -c -)
          unzip -q -o "$RUNNER_TEMP/$zip" terraform -d "$RUNNER_TEMP/terraform-bin"
          sudo mv "$RUNNER_TEMP/terraform-bin/terraform" /usr/local/bin/terraform
          terraform version

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -diff

      - name: Initialise without state
        # -backend=false: downloads the providers the lock file pins, but never
        # touches state. There is none in CI, and validate does not need it.
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform validate

      - name: Install TFLint
        shell: bash
        run: |
          zip="tflint_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/$zip"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/$zip" tflint -d "$RUNNER_TEMP/tflint-bin"
          sudo mv "$RUNNER_TEMP/tflint-bin/tflint" /usr/local/bin/tflint
          tflint --version

      - name: Lint
        # Only the Terraform rules bundled in TFLint, so no `tflint --init`.
        run: tflint --chdir=terraform --format=compact
