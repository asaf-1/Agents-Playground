name: Terraform Validate

# Checks terraform/ without building anything: formatting, validity, the unit
# tests in terraform/tests/, a plan, TFLint, and that the lock file still covers
# both platforms the cluster is built on. TFLint's rules are in
# terraform/.tflint.hcl.
#
# No cluster is created here. The plan runs with no state and no credentials -
# lazy_load on the kubectl provider means nothing connects - so it costs seconds
# and is what makes the precondition messages in main.tf appear on the PR. The
# post-merge Kubernetes canary is still what proves a cluster actually comes up.
#
# Advisory: it is not a required check, so a failure warns on the PR but never
# blocks the merge. PR Validation / Pre-Merge Gate stays the only required
# check.
#
# It runs for kind/ and k8s/ as well as terraform/, because main.tf reads
# kind/kind-config.yaml and the manifests in k8s/, and holds preconditions about
# what is in them. Without those paths, the PR that breaks a guard is the one
# PR that never runs it.
#
# Since 2026-10-25 it also checks terraform-github/, the repository's own
# settings on GitHub: the same steps, minus the plan, because that folder's
# state is in HCP Terraform and its token stays on a laptop, so CI has neither,
# by design. Those steps first ran on manual dispatch only and were timed on a
# runner (run 40239083542: about 4 seconds for all six) before being switched
# on for every PR - the CLAUDE.md rule for anything new in CI.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "terraform-github/**"
      - "kind/**"
      - "k8s/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The same pinned version as k8s-canary.yml.
      TF_VERSION: 1.16.2
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"
      TFLINT_VERSION: v0.64.0
      # SHA256 of tflint_linux_amd64.zip. Written here, not downloaded, so a
      # swapped release file fails the install. It was taken from the release's
      # checksums.txt after cosign showed that file was signed by
      # terraform-linters/tflint's own release workflow.
      TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        shell: bash
        run: |
          # The same install as k8s-canary.yml: HashiCorp's release server,
          # checked against the published SHA256SUMS, unpacked in $RUNNER_TEMP.
          base="https://releases.hashicorp.com/terraform/${TF_VERSION}"
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "$base/$zip"
          curl -fsSLo "$RUNNER_TEMP/terraform_SHA256SUMS" "$base/terraform_${TF_VERSION}_SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $zip\$" terraform_SHA256SUMS | sha256sum -c -)
          unzip -q -o "$RUNNER_TEMP/$zip" terraform -d "$RUNNER_TEMP/terraform-bin"
          sudo mv "$RUNNER_TEMP/terraform-bin/terraform" /usr/local/bin/terraform
          terraform version

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -diff

      - name: Initialise without state
        # -backend=false: downloads the providers the lock file pins, but never
        # touches state. There is none in CI, and neither validate nor a plan of
        # a cluster that does not exist needs any.
        #
        # -lockfile=readonly: fail rather than quietly resolve a new version, so
        # a change to the constraints in versions.tf that did not update
        # .terraform.lock.hcl is caught here instead of on someone's laptop.
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform -chdir=terraform validate

      - name: Test
        # terraform/tests/: the guards in main.tf handed deliberately broken
        # files, to prove they still refuse them. Mocked providers, so nothing
        # is created and no network is used.
        run: terraform -chdir=terraform test

      - name: Plan
        # Where the preconditions and the image rewrite are actually evaluated
        # against the real kind/ and k8s/ files. fmt, validate and TFLint never
        # see them.
        run: terraform -chdir=terraform plan -input=false -no-color

      # terraform-github/: the repository's own settings on GitHub. No plan
      # step: CI has no HCP login and no GitHub token for this folder, on
      # purpose.
      - name: Check formatting (terraform-github)
        run: terraform -chdir=terraform-github fmt -check -diff

      - name: Initialise without state (terraform-github)
        # -backend=false also skips the HCP Terraform (cloud) block, so this
        # needs no login. The lock file is still enforced.
        run: terraform -chdir=terraform-github init -backend=false -input=false -lockfile=readonly

      - name: Validate (terraform-github)
        run: terraform -chdir=terraform-github validate

      - name: Test (terraform-github)
        # terraform-github/tests/: the ruleset stays active with Pre-Merge Gate
        # required and nobody exempt, the push skill's switches stay on, the
        # ai-reviewed label stays, and a classic token is refused. Mocked
        # provider, so no network and no GitHub.
        run: terraform -chdir=terraform-github test

      - name: Install TFLint
        shell: bash
        run: |
          zip="tflint_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/$zip"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/$zip" tflint -d "$RUNNER_TEMP/tflint-bin"
          sudo mv "$RUNNER_TEMP/tflint-bin/tflint" /usr/local/bin/tflint
          tflint --version

      - name: Lint
        # Only the Terraform rules bundled in TFLint, so no `tflint --init`.
        run: tflint --chdir=terraform --format=compact

      - name: Lint (terraform-github)
        run: tflint --chdir=terraform-github --format=compact

      - name: Check the lock file still covers both platforms
        shell: bash
        run: |
          # The cluster is built on Windows laptops and on Linux runners, so
          # .terraform.lock.hcl has to carry hashes for both. A lock regenerated
          # on one OS silently drops the other: CI stays green and the next
          # init on the other OS fails on a missing checksum.
          #
          # Re-locking both platforms changes nothing when both are present, so
          # a non-empty diff means one was missing. Last, because it is the one
          # step that writes to the working tree.
          terraform -chdir=terraform providers lock -platform=linux_amd64 -platform=windows_amd64
          git diff --exit-code terraform/.terraform.lock.hcl

      - name: Check the lock file still covers both platforms (terraform-github)
        shell: bash
        run: |
          # The same check for the second folder, for the same reason.
          terraform -chdir=terraform-github providers lock -platform=linux_amd64 -platform=windows_amd64
          git diff --exit-code terraform-github/.terraform.lock.hcl
