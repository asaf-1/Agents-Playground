name: Publish Playwright Runner

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.e2e
      - package.json
      - package-lock.json
      - .github/workflows/publish-playwright-runner.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/asaf-1/genai-agenticai-demo-playwright
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish Playwright runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.e2e
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=playwright-runner
          cache-to: type=gha,mode=max,scope=playwright-runner
