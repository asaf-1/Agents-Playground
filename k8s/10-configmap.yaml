# The app's settings, kept out of the Deployment.
#
# Anything added here reaches the container as an environment variable, because
# the Deployment pulls the whole map in with envFrom. So a new setting is one
# line in this file and nothing else.
#
# Only non-secret values belong here: a ConfigMap is stored in plain text and
# anyone who can read the namespace can read it. Nothing in this app is
# sensitive today, which is why there is no Secret next to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-playground-config
  namespace: agents-playground
  labels:
    app: agents-playground
data:
  # Load bearing, not a repetition of the Dockerfile for neatness: server.js
  # defaults HOST to 127.0.0.1, which inside a pod is unreachable from the
  # Service. Getting this wrong shows up as a probe timeout over a container
  # log that looks perfectly healthy.
  HOST: "0.0.0.0"

  # Matches containerPort and the Service's targetPort in service.yaml.
  PORT: "4173"

  # Playground Bank's hold on repeated failed log-ins: after this many wrong
  # passwords for one email from one client, that pair is held for this many
  # seconds, then released by itself. These are the server's defaults written
  # out, so the cluster states them rather than inheriting them.
  BANK_LOGIN_MAX_FAILURES: "5"
  BANK_LOGIN_HOLD_SECONDS: "900"

  # Whose address the hold counts (bank/auth.js). "false": the connection's
  # own address, because no proxy that rewrites X-Forwarded-For sits in front
  # of this cluster. Render, which has one, sets "true" in render.yaml.
  BANK_TRUST_PROXY: "false"

  # Password hashes and checks at once, and how many may wait for a turn
  # before the answer is "busy, try again" (bank/limits.js). The server's
  # defaults, written out. The sign-up limit (BANK_SIGNUP_BURST) is left out
  # on purpose: unset means no limit, as on a laptop.
  BANK_HASH_CONCURRENCY: "4"
  BANK_HASH_QUEUE: "100"

  # Requests one personal API key may make in a minute (the Developer page).
  # The server's default, written out for the same reason.
  BANK_KEY_RATE_LIMIT: "60"
