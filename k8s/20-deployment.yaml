apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-playground
  namespace: agents-playground
  labels:
    app: agents-playground
spec:
  # MUST stay 1. server.js keeps runtimeState in process memory - including the
  # sessions Map - and the test hooks reset fixture state in that same process.
  # With two pods behind the Service, a session minted against one pod would
  # intermittently fail authorization against the other, and a state reset would
  # leave the second pod serving stale fixtures. Raising this is a correctness
  # change, not capacity tuning, and it breaks deterministic tests first.
  replicas: 1

  # Recreate, not RollingUpdate. At replicas: 1 a rolling update still surges to
  # a second pod, so two processes with separate in-memory state would briefly
  # serve the same Service. A few seconds of downtime is the correct trade for a
  # canary that must never answer from two different state machines.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: agents-playground

  template:
    metadata:
      labels:
        app: agents-playground

      annotations:
        # Changing a ConfigMap does NOT restart anything by itself: Kubernetes
        # updates the object and leaves running pods with the values they
        # started with. Nothing would look wrong, and the new setting simply
        # would not be in effect.
        #
        # So terraform/main.tf replaces the literal below with a hash of
        # k8s/configmap.yaml. A settings change then changes the pod template,
        # which is a real rollout. The CLI path does not need it - npm run
        # k8s:deploy restarts the Deployment itself - and the canary builds a
        # new cluster every run, so the literal is what they apply.
        agents-playground/config-checksum: "rewritten-by-terraform"
    spec:
      # server.js handles SIGTERM with server.close(), which stops accepting new
      # connections but does not destroy idle keep-alive sockets, so shutdown can
      # run to the end of the grace period. 30s (the default, explicit here) is
      # comfortably longer than that takes.
      terminationGracePeriodSeconds: 30

      containers:
        - name: app
          image: agents-playground:local

          # Never, not IfNotPresent. The image only ever arrives via
          # `kind load docker-image`; it exists in no registry. Never turns a
          # missing load into an immediate ErrImageNeverPull instead of a
          # 60-second ImagePullBackOff against Docker Hub.
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 4173

          # Every key in the ConfigMap becomes an environment variable, so a
          # new setting is one line in k8s/configmap.yaml and nothing here.
          # The values and why they matter are documented in that file.
          envFrom:
            - configMapRef:
                name: agents-playground-config

          # Guards the boot window. While a startupProbe is running, Kubernetes
          # suspends both other probes, which removes a real trap: without it,
          # liveness starts its own clock, and a host slow enough to miss that
          # deadline gets its container killed and restarted before readiness
          # ever passes - a restart loop whose cause is invisible in the logs.
          # 30 x 2s gives the app a full minute to come up; exceeding that is a
          # genuine failure rather than a slow runner.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          # Gates the rollout. `kubectl rollout status` cannot go Available until
          # /api/health actually answers, which is the signal the docker-run
          # canary never had.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15

          # Catches a wedged process that is still holding the port open - the
          # failure mode a container health check cannot see. No initial delay:
          # the startupProbe above already owns the boot window.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # The memory limit covers start-up, not the steady state. This
          # Deployment sets no DATABASE_URL, so Playground Bank runs PGlite
          # (Postgres compiled to WebAssembly) inside the process, and starting
          # it peaks at about 1 GB before settling near 400 MB. At 512Mi the
          # container was OOMKilled (exit 137) on every start and never became
          # Ready. With DATABASE_URL set, PGlite never loads and far less is
          # needed.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1536Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

            # Not root. Inside a container the default user is often root, so
            # anything that gets in through the app arrives as administrator of
            # that container. 1000 is the `node` user that ships in the base
            # image; runAsNonRoot makes the kubelet refuse to start the pod at
            # all if the image ever goes back to root, rather than running it.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

            # The container cannot write to its own filesystem. Getting in is
            # rarely the whole attack - the next step is usually to write a
            # script or a tool somewhere and run it, and this removes the
            # somewhere.
            #
            # Safe here because the app writes nothing: it serves from memory
            # and, without DATABASE_URL, runs PGlite in memory too (bank/db.js).
            # If something ever does need to write, give it one small
            # emptyDir volume for that path rather than turning this off.
            readOnlyRootFilesystem: true

            # Which low-level requests the container may make to the Linux
            # kernel. RuntimeDefault is the container runtime's own list, which
            # blocks the couple of hundred calls almost nothing legitimate
            # needs - the ones used to break out of a container or tamper with
            # the host. Without it a container may ask for anything.
            #
            # Not the strictest option available, deliberately: a hand-written
            # list would have to be maintained against whatever Node does
            # next, and would fail in ways that look like application bugs.
            seccompProfile:
              type: RuntimeDefault
